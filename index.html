<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oxford Games</title>
<style>
  :root{--bg:#14122b;--bg2:#1f1c45;--gold:#ffc83d;--gold2:#f5a400;--text:#fff;--muted:#c9c5f0;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.12)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--text);
    background:radial-gradient(1200px 700px at 50% -10%,#3a2f8f 0%,var(--bg2) 40%,var(--bg) 100%)}
  .wrap{max-width:900px;margin:0 auto;padding:48px 16px}
  h1{text-align:center;font-size:clamp(36px,7vw,60px);margin:0 0 6px;
    background:linear-gradient(180deg,#fff3c4,var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{text-align:center;color:var(--muted);margin:0 0 36px;font-size:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
  a.game{display:block;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;transition:transform .15s,background .15s}
  a.game:hover{transform:translateY(-3px);background:rgba(255,255,255,.12)}
  .icon{font-size:44px}
  .game h2{margin:10px 0 6px;font-size:24px}
  .game p{margin:0;color:var(--muted);line-height:1.45}
  .tag{display:inline-block;margin-top:12px;font-size:13px;font-weight:800;color:#3a2600;background:var(--gold);padding:4px 10px;border-radius:999px}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Oxford Games</h1>
    <p class="sub">Classroom games for English lessons</p>
    <div class="grid">
      <a class="game" href="sentence-auction/">
        <div class="icon">🔨</div>
        <h2>Sentence Auction</h2>
        <p>Teams bid coins on sentences they think are correct. Right: win a star. Wrong: lose the money!</p>
        <span class="tag">Prepare 1–8 · Grammar</span>
      </a>
    </div>
  </div>
</body>
</html>
